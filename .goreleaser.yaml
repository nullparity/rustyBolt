version: 2

project_name: rustybolt

# GoReleaser does not install Rust, Zig or cargo-zigbuild. A release runner must
# hold them. It does run `rustup target add` for each target below.
before:
  hooks:
    - rustup default stable
    - cargo install --locked cargo-zigbuild

builds:
  # The headless driver. It holds no window toolkit, so it builds for every
  # system. The native macOS application is not here; see the note below.
  - id: rustybolt
    builder: rust
    binary: rustybolt
    # A release uses `cargo zigbuild`, which cross compiles the C parts of the
    # TLS stack. A local check sets RUSTYBOLT_CARGO_CMD=build and one target.
    command: '{{ envOrDefault "RUSTYBOLT_CARGO_CMD" "zigbuild" }}'
    flags:
      - --release
      # The project is a Cargo workspace, so the package needs a name.
      - -p=bolt-cli
    targets:
      - aarch64-apple-darwin
      - x86_64-apple-darwin
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-pc-windows-gnu

archives:
  - id: rustybolt
    ids:
      - rustybolt
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - CONTRACT.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  name_template: "rustyBolt {{ .Version }}"
  header: |
    `rustybolt` is the headless driver. It runs on macOS, Linux and Windows.

    The native macOS application is not in this release. An application bundle
    holds AppKit code, so only a macOS machine can build it. Run
    `icon/build.sh` and then `macos/build-app.sh` to make `rustyBolt.app`.
