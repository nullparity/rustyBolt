[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.7"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to publish prereleases to package managers
publish-prereleases = false
# Whether to attest build provenance with Sigstore
github-attestations = true
# Extra files to include in every archive
include = ["README.md", "CONTRACT.md"]
# Steps every build job runs before cargo: the Tailwind CLI and the GTK/WebKit headers
github-build-setup = "../workflows/dist-setup.yml"
# Extra artifacts the packaging jobs build: dmg, msi, deb, rpm, AppImage
local-artifacts-jobs = ["./packages"]

[dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-pc-windows-msvc = "windows-latest"
aarch64-pc-windows-msvc = "windows-11-arm"
