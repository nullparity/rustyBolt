[package]
name = "rustybolt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless driver for the rustyBolt core"

[[bin]]
name = "rustybolt"
path = "src/main.rs"

[dependencies]
rustybolt-auth.workspace = true
rustybolt-jdk.workspace = true
rustybolt-security.workspace = true
rustybolt-core.workspace = true
rustybolt-update.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
httparse.workspace = true
sys-locale = "0.3"
rand.workspace = true
wry = "0.56.1"
tao = "0.36.0"
default-net = "0.22.0"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
png = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
