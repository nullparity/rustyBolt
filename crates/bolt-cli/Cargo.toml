[package]
name = "bolt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless driver for the rustyBolt core"

[[bin]]
name = "rustybolt"
path = "src/main.rs"

[dependencies]
bolt-auth.workspace = true
bolt-jdk.workspace = true
bolt-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wry = "0.56.1"
tao = "0.36.0"
default-net = "0.22.0"
tray-icon = "0.24.2"
