name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  cli:
    name: rustybolt ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub retired the Intel macOS runner. The arm64 runner builds the Intel binary as a cross target.
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,       name: darwin_arm64  }
          - { os: macos-14,         target: x86_64-apple-darwin,        name: darwin_amd64  }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   name: linux_amd64   }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  name: linux_arm64   }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: windows_amd64 }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc,    name: windows_arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p bolt-cli --target ${{ matrix.target }}

      - name: Archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="rustybolt_${version}_${{ matrix.name }}"
          mkdir "$stem"
          cp README.md CONTRACT.md "$stem/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rustybolt.exe" "$stem/"
            7z a -tzip "$stem.zip" "$stem" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/rustybolt" "$stem/"
            tar -czf "$stem.tar.gz" "$stem"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            rustybolt_*.tar.gz
            rustybolt_*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum rusty* > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "rustyBolt ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            assets/*
