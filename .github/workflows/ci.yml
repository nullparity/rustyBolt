name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # bolt-macos holds AppKit code, so only a macOS runner compiles it.
      - name: Clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy
        if: runner.os != 'macOS'
        run: cargo clippy --workspace --exclude bolt-macos --all-targets -- -D warnings

      - name: Test
        if: runner.os == 'macOS'
        run: cargo test --workspace
      - name: Test
        if: runner.os != 'macOS'
        run: cargo test --workspace --exclude bolt-macos
