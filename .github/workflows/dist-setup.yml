# Steps that dist inserts into every build job before it runs cargo.
- name: Install Tailwind CLI
  shell: bash
  run: |
    scripts/install-tailwindcss.sh "$RUNNER_TEMP/bin"
    echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
- name: Install Linux dependencies
  if: runner.os == 'Linux'
  shell: bash
  run: |
    sudo apt-get update
    sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev
