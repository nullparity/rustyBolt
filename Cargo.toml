[workspace]
resolver = "2"
members = [
    "crates/bolt-auth",
    "crates/bolt-jdk",
    "crates/bolt-security",
    "crates/bolt-core",
    "crates/bolt-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
bolt-auth = { path = "crates/bolt-auth" }
bolt-jdk = { path = "crates/bolt-jdk" }
bolt-security = { path = "crates/bolt-security" }
bolt-core = { path = "crates/bolt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
lto = "thin"
strip = true
