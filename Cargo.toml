[workspace]
resolver = "2"
members = [
    "crates/rustybolt-auth",
    "crates/rustybolt-jdk",
    "crates/rustybolt-security",
    "crates/rustybolt-core",
    "crates/rustybolt-cli",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/nullparity/rustyBolt"

[workspace.dependencies]
rustybolt-auth = { path = "crates/rustybolt-auth" }
rustybolt-jdk = { path = "crates/rustybolt-jdk" }
rustybolt-security = { path = "crates/rustybolt-security" }
rustybolt-core = { path = "crates/rustybolt-core" }
nullparity-update = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
ureq = { version = "3", features = ["json"] }
url = "2"
percent-encoding = "2"
form_urlencoded = "1"
shlex = "1"
httparse = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
lto = "thin"
strip = true
